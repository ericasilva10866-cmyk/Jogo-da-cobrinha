<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Cobrinha — Bate e Perde</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    #placa {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #4CAF50;
    }
    canvas {
      border: 3px solid #4CAF50;
      background: #222;
    }
    .controles {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(2, 50px);
      gap: 8px;
    }
    .btn {
      background: #4CAF50;
      border: none;
      color: white;
      font-size: 22px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-cima { grid-column: 2; grid-row: 1; }
    .btn-esq { grid-column: 1; grid-row: 2; }
    .btn-dir { grid-column: 3; grid-row: 2; }
    .btn-baixo { grid-column: 2; grid-row: 2; }
  </style>
</head>
<body>

<div id="placa">Pontos: 0</div>
<canvas id="jogo" width="300" height="300"></canvas>

<div class="controles">
  <button class="btn btn-cima" id="btn-cima">↑</button>
  <button class="btn btn-esq" id="btn-esq">←</button>
  <button class="btn btn-dir" id="btn-dir">→</button>
  <button class="btn btn-baixo" id="btn-baixo">↓</button>
</div>

<script>
const canvas = document.getElementById('jogo');
const pincel = canvas.getContext('2d');
const placaTxt = document.getElementById('placa');

const tamanho = 15;
const larguraTela = canvas.width;
const alturaTela = canvas.height;

let cobra = [
  {x: 5 * tamanho, y: 5 * tamanho}
];
let direcao = {x: tamanho, y: 0};
let comida = novaComida();
let pontos = 0;
let jogoRodando = true;

function novaComida() {
  return {
    x: Math.floor(Math.random() * (larguraTela / tamanho)) * tamanho,
    y: Math.floor(Math.random() * (alturaTela / tamanho)) * tamanho
  };
}

function desenhar() {
  // Fundo
  pincel.fillStyle = '#222';
  pincel.fillRect(0, 0, larguraTela, alturaTela);

  // Comida
  pincel.fillStyle = '#ff4444';
  pincel.fillRect(comida.x, comida.y, tamanho - 2, tamanho - 2);

  // Cobra
  pincel.fillStyle = '#4CAF50';
  cobra.forEach(parte => {
    pincel.fillRect(parte.x, parte.y, tamanho - 2, tamanho - 2);
  });
}

function mover() {
  if (!jogoRodando) return;

  const cabeca = {
    x: cobra[0].x + direcao.x,
    y: cobra[0].y + direcao.y
  };

  // ======================================
  // ✅ AQUI: BATEU NA PAREDE → PERDEU!
  // ======================================
  if (
    cabeca.x < 0 ||                    // Saiu pela esquerda
    cabeca.x >= larguraTela ||         // Saiu pela direita
    cabeca.y < 0 ||                    // Saiu por cima
    cabeca.y >= alturaTela             // Saiu por baixo
  ) {
    jogoRodando = false;
    alert("💥 FIM DE JOGO! Pontos: " + pontos + "\nClique OK para jogar de novo!");
    reiniciarJogo();
    return;
  }

  // Colisão com o próprio corpo
  for (let i = 1; i < cobra.length; i++) {
    if (cabeca.x === cobra[i].x && cabeca.y === cobra[i].y) {
      jogoRodando = false;
      alert("💥 FIM DE JOGO! Pontos: " + pontos + "\nClique OK para jogar de novo!");
      reiniciarJogo();
      return;
    }
  }

  cobra.unshift(cabeca);

  // Comeu a comida
  if (cabeca.x === comida.x && cabeca.y === comida.y) {
    pontos++;
    placaTxt.textContent = "Pontos: " + pontos;
    comida = novaComida();
    // Não apaga o rabo → cresce
  } else {
    cobra.pop();
  }
}

function reiniciarJogo() {
  cobra = [{x: 5 * tamanho, y: 5 * tamanho}];
  direcao = {x: tamanho, y: 0};
  comida = novaComida();
  pontos = 0;
  placaTxt.textContent = "Pontos: 0";
  jogoRodando = true;
}

function loop() {
  mover();
  desenhar();
  setTimeout(loop, 120);
}

// Controles do teclado
document.addEventListener('keydown', (e) => {
  if (!jogoRodando) return;
  if (e.key === 'ArrowUp' && direcao.y === 0) direcao = {x: 0, y: -tamanho};
  else if (e.key === 'ArrowDown' && direcao.y === 0) direcao = {x: 0, y: tamanho};
  else if (e.key === 'ArrowLeft' && direcao.x === 0) direcao = {x: -tamanho, y: 0};
  else if (e.key === 'ArrowRight' && direcao.x === 0) direcao = {x: tamanho, y: 0};
});

// Botões de toque
document.getElementById('btn-cima').addEventListener('click', () => {
  if (direcao.y === 0) direcao = {x: 0, y: -tamanho};
});
document.getElementById('btn-baixo').addEventListener('click', () => {
  if (direcao.y === 0) direcao = {x: 0, y: tamanho};
});
document.getElementById('btn-esq').addEventListener('click', () => {
  if (direcao.x === 0) direcao = {x: -tamanho, y: 0};
});
document.getElementById('btn-dir').addEventListener('click', () => {
  if (direcao.x === 0) direcao = {x: tamanho, y: 0};
});

loop();
</script>
</body>
</html>
